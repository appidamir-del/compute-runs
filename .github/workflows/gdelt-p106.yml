# gdelt-p106 — single-run GDELT 1.0 daily aggregate build for calendar 2025.
#
# One manual run processes all 365 days of 2025 (default 400 new days or
# 300 minutes of wall clock, whichever comes first), commits the updated
# checkpoint partials back to this repo with the built-in GITHUB_TOKEN,
# and stops cleanly. If the run stops early, a re-dispatch resumes from
# the committed partials, so no day is ever downloaded twice. When all
# 365 days are present, run.sh assembles the frozen parquet and this
# workflow uploads it as an artifact (it is never committed).
#
# Trigger: manual dispatch ONLY (single-run job; no schedule — a second
# run is dispatched by hand only if the first stops early, at most twice
# in total). Concurrency: one run at a time; a second trigger waits,
# never cancels.
name: gdelt-p106

on:
  workflow_dispatch:
    inputs:
      max_days:
        description: "Max NEW days to process this run"
        required: false
        default: "400"
        type: string
      max_minutes:
        description: "Wall-clock budget in minutes (job limit is 360)"
        required: false
        default: "300"
        type: string

concurrency:
  group: gdelt-p106
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build chunk
        env:
          MAX_DAYS: ${{ inputs.max_days || '400' }}
          MAX_MINUTES: ${{ inputs.max_minutes || '300' }}
        run: bash gdelt-p106/run.sh

      - name: Commit updated partials
        # Always checkpoint: even a failed run must not lose the days it
        # already aggregated (the worker appends + flushes per day).
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gdelt-p106/partials/partial_*.csv
          if git diff --cached --quiet; then
            echo "no partial changes to commit"
          else
            DAYS_DONE=$(python3 -c "import glob; print(sum(sum(1 for _ in open(f)) - 1 for f in glob.glob('gdelt-p106/partials/partial_*.csv')))")
            git commit -m "gdelt-p106: checkpoint partials ${DAYS_DONE}/365 days (run #${{ github.run_number }})"
          fi
          git push

      - name: Upload frozen file (final run only)
        if: always() && hashFiles('gdelt-p106/partials/gdelt_daily_frozen_2025.parquet') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gdelt-daily-frozen-2025
          path: gdelt-p106/partials/gdelt_daily_frozen_2025.parquet
          retention-days: 30
          if-no-files-found: error
